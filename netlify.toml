# Kennely: Netlify Free, statische Oberfläche + serverlose Funktionen
[build]
  publish = "public"
  command = "echo Kennely ohne Build-Schritt"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "country-gate"
  path = "/*"
  excludedPath = ["/api/*"]

[[redirects]]
  from = "/legal/impressum"
  to = "/legal/imprint.html"
  status = 200

[[redirects]]
  from = "/legal/datenschutz"
  to = "/legal/privacy.html"
  status = 200

[[redirects]]
  from = "/legal/nutzungsbedingungen"
  to = "/legal/terms.html"
  status = 200

[[redirects]]
  from = "/legal/regeln"
  to = "/legal/rules.html"
  status = 200

[[redirects]]
  from = "/legal/beschwerden"
  to = "/legal/complaints.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"


# Do not preserve outdated HTML and application code after a new deployment.
# The explicitly versioned CSS/JS URLs in index.html also bust client caches.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/social-app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/ken13-ui.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
